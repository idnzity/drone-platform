<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>Drone fleet platform architecture</title>
  <desc>Control panel (REST and SignalR) and LLM agent talk to the planner. The planner uses the mission compiler and reads and writes storage; its missions pass the pre-flight safety validator before going to the message bus. Telemetry and events from the bus feed the planner, storage and an in-flight safety monitor that can issue an emergency return-to-launch. The drone gateway translates between the bus and MAVLink drones running in SITL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="640" fill="#FFFFFF"/>

  <!-- Row 1: clients -->
  <rect x="90" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="190" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Control panel</text>
  <text x="190" y="70" text-anchor="middle" font-size="12" fill="#5F5E5A">Angular, map</text>

  <rect x="390" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="490" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">LLM agent</text>
  <text x="490" y="70" text-anchor="middle" font-size="12" fill="#5F5E5A">same API as the panel</text>

  <path d="M250 88 L250 108 L310 108 L310 128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="242" y="106" text-anchor="end" font-size="12" fill="#5F5E5A">REST + SignalR</text>
  <path d="M430 88 L430 108 L370 108 L370 128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Row 2: compiler, planner, storage -->
  <rect x="40" y="130" width="172" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="126" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Mission compiler</text>
  <text x="126" y="170" text-anchor="middle" font-size="12" fill="#534AB7">waypoints, estimates</text>

  <rect x="254" y="130" width="172" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Planner</text>
  <text x="340" y="170" text-anchor="middle" font-size="12" fill="#534AB7">what, who, when</text>

  <rect x="468" y="130" width="172" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="554" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Storage: Postgres</text>
  <text x="554" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">Timescale + PostGIS</text>

  <line x1="214" y1="158" x2="252" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="428" y1="158" x2="466" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Row 3: safety -->
  <path d="M280 188 L280 208 L190 208 L190 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="230" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="190" y="253" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Safety validator</text>
  <text x="190" y="270" text-anchor="middle" font-size="12" fill="#993C1D">pre-flight checks</text>

  <rect x="390" y="230" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="490" y="253" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Safety monitor</text>
  <text x="490" y="270" text-anchor="middle" font-size="12" fill="#993C1D">in flight: battery, fence</text>

  <!-- Bus connections -->
  <line x1="190" y1="288" x2="190" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="328" x2="340" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="334" y="306" text-anchor="end" font-size="12" fill="#5F5E5A">telemetry, events</text>
  <line x1="490" y1="288" x2="490" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="498" y="312" font-size="12" fill="#5F5E5A">emergency RTL</text>
  <line x1="615" y1="328" x2="615" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 4: bus -->
  <rect x="60" y="330" width="560" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="340" y="353" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Message bus</text>
  <text x="340" y="370" text-anchor="middle" font-size="12" fill="#5F5E5A">state · events · commands</text>

  <line x1="290" y1="388" x2="290" y2="428" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="428" x2="390" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="412" text-anchor="end" font-size="12" fill="#5F5E5A">commands</text>
  <text x="400" y="412" font-size="12" fill="#5F5E5A">telemetry, events</text>

  <!-- Row 5-6: drone link -->
  <rect x="210" y="430" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="453" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Drone gateway</text>
  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#0F6E56">MAVLink ↔ internal DTOs</text>

  <line x1="340" y1="488" x2="340" y2="528" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="350" y="512" font-size="12" fill="#5F5E5A">MAVLink</text>

  <rect x="210" y="530" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="553" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Drones: SITL in Docker</text>
  <text x="340" y="570" text-anchor="middle" font-size="12" fill="#0F6E56">N containers, onboard failsafe</text>

  <!-- Legend -->
  <rect x="96" y="610" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="114" y="620" font-size="12" fill="#5F5E5A">fleet logic</text>
  <rect x="200" y="610" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="218" y="620" font-size="12" fill="#5F5E5A">safety (shared rules)</text>
  <rect x="356" y="610" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="374" y="620" font-size="12" fill="#5F5E5A">drone link</text>
  <rect x="460" y="610" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="478" y="620" font-size="12" fill="#5F5E5A">infrastructure, clients</text>
</svg>
